<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anis AI - Cinematic Companion</title>
    <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
    <style>
      :root {
        --bg: #040b16;
        --panel: rgba(12, 23, 38, 0.82);
        --panel-border: rgba(34, 211, 238, 0.32);
        --cyan: #75e6ff;
        --cyan-deep: #0891b2;
        --muted: #9ab7c4;
        --text: #eaf9ff;
        --amber: #fbbf24;
        --red: #f87171;
        --green: #34d399;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 50% 12%, rgba(103, 232, 249, 0.16), transparent 18%),
          radial-gradient(circle at 50% 80%, rgba(16, 46, 72, 0.75), transparent 38%),
          linear-gradient(180deg, #040b16, #020712 52%, #01070d);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body { overflow: hidden; }

      .shell { height: 100%; display: flex; flex-direction: column; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px;
        background: rgba(6, 14, 22, 0.72);
        border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.9);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--cyan);
      }

      .live-state {
        color: var(--muted);
        letter-spacing: 0.12em;
        font-size: 0.74rem;
        text-transform: uppercase;
      }

      .workspace {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .viewport {
        flex: 1;
        position: relative;
        border-right: 1px solid rgba(148, 163, 184, 0.15);
      }

      .viewport::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(103, 232, 249, 0.12), transparent 48%);
        pointer-events: none;
      }

      .sidebar {
        width: 360px;
        padding: 18px 18px 14px;
        background: rgba(8, 17, 24, 0.72);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        box-shadow: 0 18px 28px rgba(2, 8, 19, 0.32);
        padding: 14px 14px 12px;
      }

      .card h3 {
        margin: 0 0 10px;
        color: var(--cyan);
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .transcript {
        min-height: 72px;
        color: var(--text);
        line-height: 1.55;
        white-space: pre-wrap;
        font-size: 0.96rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 1px solid rgba(103, 232, 249, 0.35);
        background: linear-gradient(180deg, rgba(83, 196, 233, 0.18), rgba(6, 182, 212, 0.12));
        color: var(--text);
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 12px rgba(103, 232, 249, 0.28);
      }

      button.secondary {
        background: rgba(148, 163, 184, 0.08);
        border-color: rgba(148, 163, 184, 0.2);
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .connection-pill {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 10px rgba(248, 113, 113, 0.7);
      }

      .tiny {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .workspace {
          flex-direction: column;
        }

        .viewport {
          min-height: 55vh;
          border-right: none;
          border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        }

        .sidebar {
          width: 100%;
          min-height: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <h1>ANIS AI</h1>
        </div>
        <div class="live-state" id="live-state">Idle</div>
      </header>

      <main class="workspace">
        <section class="viewport" id="viewport"></section>

        <aside class="sidebar">
          <div class="card">
            <h3>Live Transcript</h3>
            <div class="transcript" id="transcript">Say: “Anis, open YouTube” or tap the mic.</div>
          </div>

          <div class="card">
            <h3>Controls</h3>
            <div class="controls">
              <button id="mic-btn">Start Mic</button>
              <button id="speak-btn" class="secondary">Say Hello</button>
              <button id="stop-btn" class="secondary">Stop</button>
            </div>
          </div>

          <div class="card">
            <h3>Connection</h3>
            <div class="status-row">
              <span class="connection-pill" id="connection-pill"></span>
              <span id="connection-text">Offline</span>
            </div>
            <div class="tiny" style="margin-top: 8px;">
              The assistant will respond with local voice synthesis when the backend is unavailable.
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="./avatar.js"></script>
  </body>
</html>
